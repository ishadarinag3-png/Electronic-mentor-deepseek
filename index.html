<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Electronics Mentor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 20px;
      padding-top: env(safe-area-inset-top, 20px);
      padding-bottom: env(safe-area-inset-bottom, 20px);
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 4px;
      color: #f59e0b;
    }
    .sub {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 24px;
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg {
      padding: 10px 14px;
      border-radius: 14px;
      max-width: 85%;
      font-size: 15px;
      line-height: 1.4;
      word-wrap: break-word;
    }
    .msg.user {
      background: #f59e0b;
      color: #0f172a;
      align-self: flex-end;
      font-weight: 500;
    }
    .msg.bot {
      background: #1e293b;
      color: #e2e8f0;
      align-self: flex-start;
    }
    #input-row {
      display: flex;
      gap: 8px;
    }
    #input {
      flex: 1;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #e2e8f0;
      font-size: 16px;
      outline: none;
    }
    #input:focus {
      border-color: #f59e0b;
    }
    #send {
      padding: 12px 20px;
      border-radius: 12px;
      border: none;
      background: #f59e0b;
      color: #0f172a;
      font-weight: 600;
      font-size: 16px;
    }
    #send:active {
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <h1>Electronics Mentor</h1>
  <div class="sub">Step 5 — skeleton only</div>

  <div id="messages"></div>

  <div id="input-row">
    <input id="input" type="text" placeholder="Type a message..." autocomplete="off">
    <button id="send">Send</button>
  </div>

  <script>
    const messages = document.getElementById('messages');
    const input = document.getElementById('input');
    const send = document.getElementById('send');

    function addMessage(text, who) {
      const div = document.createElement('div');
      div.className = 'msg ' + who;
      div.textContent = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    function handleSend() {
      const text = input.value.trim();
      if (!text) return;
      addMessage(text, 'user');
      input.value = '';
      setTimeout(() => {
        addMessage('(echo) ' + text, 'bot');
      }, 300);
    }

    send.addEventListener('click', handleSend);
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') handleSend();
    });

    addMessage('Hi! I am not smart yet. Type anything and I will echo it back.', 'bot');
  </script>
</body>
</html>
